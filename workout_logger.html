const GH_CFG_KEY = "wl-gh-cfg-v1";

function ghLoadCfg(){
  try{
    const c = JSON.parse(localStorage.getItem(GH_CFG_KEY)||"{}");
    if(c.pat) document.getElementById("gh-pat").value = c.pat;
    if(c.repo) document.getElementById("gh-repo").value = c.repo;
    if(c.path) document.getElementById("gh-path").value = c.path;
    if(c.branch) document.getElementById("gh-branch").value = c.branch;
  }catch(_){}
}

function ghSaveCfg(){
  const cfg = {
    pat: document.getElementById("gh-pat").value.trim(),
    repo: document.getElementById("gh-repo").value.trim(),
    path: document.getElementById("gh-path").value.trim(),
    branch: document.getElementById("gh-branch").value.trim()
  };
  localStorage.setItem(GH_CFG_KEY, JSON.stringify(cfg));
  toast("✅ GitHub 設定已儲存");
}

function ghGetCfg(){
  return {
    pat: document.getElementById("gh-pat").value.trim(),
    repo: document.getElementById("gh-repo").value.trim(),
    path: document.getElementById("gh-path").value.trim(),
    branch: document.getElementById("gh-branch").value.trim()
  };
}

function ghSetStatus(state, text){
  const dot = document.getElementById("gh-status-dot");
  const txt = document.getElementById("gh-status-text");
  dot.className = state; // '', 'ok', 'err', 'busy'
  txt.textContent = text;
}

function ghShowCommit(sha, message, date){
  const el = document.getElementById("gh-commit-info");
  if(!sha){ el.style.display="none"; return; }
  const shortSha = sha.slice(0,7);
  const dateStr = date ? new Date(date).toLocaleString("zh-TW",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}) : "";
  el.style.display = "block";
  el.innerHTML = `<span class="gh-commit-sha">${shortSha}</span> <span style="color:#555;">${message||""}</span><br><span style="color:#bbb;">${dateStr}</span>`;
}

async function ghApiRequest(pat, method, url, body){
  const opts = {
    method,
    headers:{
      "Authorization": `Bearer ${pat}`,
      "Accept": "application/vnd.github+json",
      "X-GitHub-Api-Version": "2022-11-28"
    }
  };
  if(body) { opts.headers["Content-Type"]="application/json"; opts.body=JSON.stringify(body); }
  const res = await fetch(url, opts);
  const data = await res.json();
  if(!res.ok) throw new Error(data.message || `HTTP ${res.status}`);
  return data;
}

async function ghPull(){
  const {pat, repo, path, branch} = ghGetCfg();
  if(!pat || !repo || !path){ toast("⚠️ 請先填寫 PAT、repo、檔名"); return; }
  ghSetStatus("busy","拉取中…");
  try{
    const url = `https://api.github.com/repos/${repo}/contents/${path}?ref=${branch||"main"}`;
    const data = await ghApiRequest(pat, "GET", url);
    // data.content is base64
    const decoded = decodeURIComponent(escape(atob(data.content.replace(/\n/g,""))));
    // Open as blob so user can save or replace
    const blob = new Blob([decoded], {type:"text/html"});
    const blobUrl = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = blobUrl;
    a.download = path.split("/").pop() || "workout_logger.html";
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(blobUrl); }, 300);
    const sha = data.sha;
    const commitMsg = data.name;
    ghShowCommit(sha, `遠端版本 (${branch||"main"})`, null);
    ghSetStatus("ok", "Pull 成功 ✓");
    // Store sha for next push
    localStorage.setItem("wl-gh-sha", sha);
    toast("✅ 已下載 GitHub 最新版本");
  }catch(e){
    ghSetStatus("err","Pull 失敗");
    toast("❌ Pull 錯誤："+e.message);
  }
}

async function ghPush(){
  const {pat, repo, path, branch} = ghGetCfg();
  if(!pat || !repo || !path){ toast("⚠️ 請先填寫 PAT、repo、檔名"); return; }
  ghSetStatus("busy","推送中…");
  try{
    // Get current SHA of the file (needed for update)
    const url = `https://api.github.com/repos/${repo}/contents/${path}`;
    let currentSha = localStorage.getItem("wl-gh-sha") || null;

    // Always fetch latest sha to avoid conflicts
    try{
      const existing = await ghApiRequest(pat, "GET", `${url}?ref=${branch||"main"}`);
      currentSha = existing.sha;
      localStorage.setItem("wl-gh-sha", currentSha);
    }catch(fetchErr){
      // File might not exist yet (first push) — that's OK, sha stays null
      if(!fetchErr.message.includes("Not Found")) throw fetchErr;
      currentSha = null;
    }

    // Serialize current HTML
    const html = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
    // Base64 encode (handle CJK chars via UTF-8)
    const encoded = btoa(unescape(encodeURIComponent(html)));

    const now = new Date();
    const dateStr = now.toLocaleDateString("zh-TW",{year:"numeric",month:"2-digit",day:"2-digit"});
    const timeStr = now.toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit"});
    const commitMessage = `workout logger update ${dateStr} ${timeStr}`;

    const body = {
      message: commitMessage,
      content: encoded,
      branch: branch||"main"
    };
    if(currentSha) body.sha = currentSha;

    const result = await ghApiRequest(pat, "PUT", url, body);
    const newSha = result.content && result.content.sha;
    if(newSha) localStorage.setItem("wl-gh-sha", newSha);

    const commitSha = result.commit && result.commit.sha;
    const commitDate = result.commit && result.commit.author && result.commit.author.date;
    ghShowCommit(commitSha||newSha, commitMessage, commitDate||new Date().toISOString());
    ghSetStatus("ok","Push 成功 ✓");
    toast("✅ 已推送到 GitHub");
  }catch(e){
    ghSetStatus("err","Push 失敗");
    toast("❌ Push 錯誤："+e.message);
  }
}

// Toggle GitHub panel (close other panels)
document.getElementById("btn-toggle-github").onclick = function(){
  const gp = document.getElementById("github-panel");
  const show = gp.style.display === "block";
  // Close other panels
  document.getElementById("log-panel").style.display = "none";
  document.getElementById("analysis-panel").style.display = "none";
  document.getElementById("monthly-panel").style.display = "none";
  document.getElementById("btn-toggle-log").textContent = "日誌";
  document.getElementById("btn-toggle-analysis").textContent = "分析";
  document.getElementById("btn-toggle-monthly").textContent = "月報";
  gp.style.display = show ? "none" : "block";
  this.textContent = show ? "⬡ GH" : "關閉";
};

document.getElementById("gh-btn-pull").onclick = ghPull;
